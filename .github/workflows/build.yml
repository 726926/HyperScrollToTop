name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK Cleanly
        run: |
          rm -rf settings.gradle build.gradle app/build.gradle app/src .gradle

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/hyper/blockscrolltop

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://api.xposed.info/' }
              }
          }
          rootProject.name = "DisableScrollToTop"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.hyper.blockscrolltop'
              compileSdk 34

              defaultConfig {
                  applicationId "com.hyper.blockscrolltop"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              compileOnly 'de.robv.android.xposed:api:82'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="禁用状态栏回顶"
                  android:supportsRtl="true">
                  <meta-data android:name="xposedmodule" android:value="true" />
                  <meta-data android:name="xposeddescription" android:value="精准屏蔽小米澎湃OS 3 状态栏点击回顶误触（保留正常下拉通知栏与图标点击）" />
                  <meta-data android:name="xposedminversion" android:value="93" />
                  <meta-data android:name="xposedscope" android:value="com.android.systemui" />
                  <activity android:name="com.hyper.blockscrolltop.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/assets/xposed_init
          com.hyper.blockscrolltop.MainHook
          EOF

          cat << 'EOF' > app/src/main/java/com/hyper/blockscrolltop/MainHook.java
          package com.hyper.blockscrolltop;

          import android.view.MotionEvent;
          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedHelpers;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;

          public class MainHook implements IXposedHookLoadPackage {

              @Override
              public void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpparam) {
                  if ("com.android.systemui".equals(lpparam.packageName)) {
                      blockStatusBarClickOnly(lpparam);
                  }
              }

              private void blockStatusBarClickOnly(XC_LoadPackage.LoadPackageParam lpparam) {
                  String[] targetClasses = {
                      "com.android.systemui.statusbar.phone.PhoneStatusBarView",
                      "com.android.systemui.statusbar.window.StatusBarWindowView",
                      "com.miui.systemui.statusbar.phone.MiuiPhoneStatusBarView",
                      "com.android.systemui.statusbar.phone.NotificationShadeWindowView"
                  };

                  for (String className : targetClasses) {
                      try {
                          XposedHelpers.findAndHookMethod(
                              className,
                              lpparam.classLoader,
                              "dispatchTouchEvent",
                              MotionEvent.class,
                              new XC_MethodHook() {
                                  private float startX = 0;
                                  private float startY = 0;

                                  @Override
                                  protected void beforeHookedMethod(MethodHookParam param) {
                                      MotionEvent event = (MotionEvent) param.args[0];
                                      if (event == null) return;

                                      int action = event.getActionMasked();
                                      if (action == MotionEvent.ACTION_DOWN) {
                                          startX = event.getRawX();
                                          startY = event.getRawY();
                                      } else if (action == MotionEvent.ACTION_UP) {
                                          float endX = event.getRawX();
                                          float endY = event.getRawY();
                                          
                                          float deltaX = Math.abs(endX - startX);
                                          float deltaY = Math.abs(endY - startY);

                                          // 精准判定：如果是原地轻触（没有大幅度滑动，排除下拉通知栏动作）
                                          if (deltaX < 25 && deltaY < 25) {
                                              // 直接吞掉此次纯点击事件，阻止系统触发回顶
                                              param.setResult(true);
                                          }
                                      }
                                  }
                              }
                          );
                      } catch (Throwable ignored) {}
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/hyper/blockscrolltop/MainActivity.java
          package com.hyper.blockscrolltop;

          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(60, 100, 60, 60);

                  TextView title = new TextView(this);
                  title.setText("屏蔽状态栏回顶");
                  title.setTextSize(22f);

                  TextView desc = new TextView(this);
                  desc.setText("已更新为精准过滤版本。正常下拉通知栏和点击图标不受影响，仅拦截误触点击回顶。请在LSPosed中勾选【系统界面(SystemUI)】后重启生效。");
                  desc.setTextSize(16f);
                  desc.setPadding(0, 30, 0, 0);

                  layout.addView(title);
                  layout.addView(desc);
                  setContentView(layout);
              }
          }
          EOF

          gradle wrapper --gradle-version 8.2
          ./gradlew assembleDebug --warning-mode none

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DisableScrollToTop-debug.apk
          path: app/build/outputs/apk/debug/*.apk
