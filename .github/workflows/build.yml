name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK Cleanly
        run: |
          rm -rf settings.gradle build.gradle app/build.gradle app/src .gradle

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/hyper/scrolltop

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://api.xposed.info/' }
              }
          }
          rootProject.name = "HyperScrollToTop"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.hyper.scrolltop'
              compileSdk 34

              defaultConfig {
                  applicationId "com.hyper.scrolltop"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              compileOnly 'de.robv.android.xposed:api:82'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="状态栏回顶"
                  android:supportsRtl="true">
                  <meta-data android:name="xposedmodule" android:value="true" />
                  <meta-data android:name="xposeddescription" android:value="小米澎湃OS 3 状态栏点击回顶模块" />
                  <meta-data android:name="xposedminversion" android:value="93" />
                  <meta-data android:name="xposedscope" android:value="com.android.systemui" />
                  <activity android:name="com.hyper.scrolltop.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/assets/xposed_init
          com.hyper.scrolltop.MainHook
          EOF

          cat << 'EOF' > app/src/main/java/com/hyper/scrolltop/MainHook.java
          package com.hyper.scrolltop;

          import android.app.Activity;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.os.Build;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.AbsListView;
          import android.widget.ScrollView;

          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedHelpers;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;

          public class MainHook implements IXposedHookLoadPackage {

              private static final String ACTION_SCROLL_TOP = "com.hyper.scrolltop.ACTION_SCROLL_TO_TOP";

              @Override
              public void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpparam) {
                  if ("com.android.systemui".equals(lpparam.packageName)) {
                      hookSystemUIStatusBar(lpparam);
                  }
                  hookActivityScroll(lpparam);
              }

              private void hookSystemUIStatusBar(XC_LoadPackage.LoadPackageParam lpparam) {
                  String[] statusBarClasses = new String[]{
                      "com.android.systemui.statusbar.phone.PhoneStatusBarView",
                      "com.android.systemui.statusbar.window.StatusBarWindowView",
                      "com.android.systemui.statusbar.phone.CentralSurfacesImpl",
                      "com.android.systemui.statusbar.phone.CollapsedStatusBarFragment"
                  };

                  for (String className : statusBarClasses) {
                      try {
                          XposedHelpers.findAndHookMethod(
                              className,
                              lpparam.classLoader,
                              "onTouchEvent",
                              MotionEvent.class,
                              new XC_MethodHook() {
                                  @Override
                                  protected void afterHookedMethod(MethodHookParam param) {
                                      MotionEvent event = (MotionEvent) param.args[0];
                                      if (event != null && event.getAction() == MotionEvent.ACTION_UP) {
                                          View view = (View) param.thisObject;
                                          if (view != null && view.getContext() != null) {
                                              Intent intent = new Intent(ACTION_SCROLL_TOP);
                                              intent.addFlags(Intent.FLAG_RECEIVER_FOREGROUND);
                                              view.getContext().sendBroadcast(intent);
                                          }
                                      }
                                  }
                              }
                          );
                      } catch (Throwable ignored) {}
                  }
              }

              private void hookActivityScroll(XC_LoadPackage.LoadPackageParam lpparam) {
                  try {
                      XposedHelpers.findAndHookMethod(
                          "android.app.Activity",
                          lpparam.classLoader,
                          "onResume",
                          new XC_MethodHook() {
                              @Override
                              protected void afterHookedMethod(MethodHookParam param) {
                                  Activity activity = (Activity) param.thisObject;
                                  if (activity == null || activity.getWindow() == null) return;
                                  View decorView = activity.getWindow().getDecorView();
                                  if (decorView == null) return;

                                  int tagKey = 0x7f010088;
                                  if (Boolean.TRUE.equals(decorView.getTag(tagKey))) return;

                                  BroadcastReceiver receiver = new BroadcastReceiver() {
                                      @Override
                                      public void onReceive(Context context, Intent intent) {
                                          if (intent != null && ACTION_SCROLL_TOP.equals(intent.getAction())) {
                                              scrollToTopRecursive(decorView);
                                          }
                                      }
                                  };

                                  IntentFilter filter = new IntentFilter(ACTION_SCROLL_TOP);
                                  if (Build.VERSION.SDK_INT >= 33) {
                                      activity.registerReceiver(receiver, filter, Context.RECEIVER_EXPORTED);
                                  } else {
                                      activity.registerReceiver(receiver, filter);
                                  }

                                  decorView.setTag(tagKey, true);
                              }
                          }
                      );
                  } catch (Throwable ignored) {}
              }

              private boolean scrollToTopRecursive(View view) {
                  if (view == null || !view.isShown()) return false;

                  if (view instanceof ScrollView) {
                      ((ScrollView) view).smoothScrollTo(0, 0);
                      return true;
                  }
                  if (view instanceof AbsListView) {
                      ((AbsListView) view).smoothScrollToPosition(0);
                      return true;
                  }

                  String className = view.getClass().getName();
                  if (className.contains("RecyclerView")) {
                      try {
                          java.lang.reflect.Method method = view.getClass().getMethod("smoothScrollToPosition", int.class);
                          method.invoke(view, 0);
                          return true;
                      } catch (Throwable ignored) {}
                  } else if (className.contains("NestedScrollView")) {
                      try {
                          java.lang.reflect.Method method = view.getClass().getMethod("smoothScrollTo", int.class, int.class);
                          method.invoke(view, 0, 0);
                          return true;
                      } catch (Throwable ignored) {}
                  }

                  if (view instanceof ViewGroup) {
                      ViewGroup group = (ViewGroup) view;
                      for (int i = 0; i < group.getChildCount(); i++) {
                          if (scrollToTopRecursive(group.getChildAt(i))) return true;
                      }
                  }
                  return false;
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/hyper/scrolltop/MainActivity.java
          package com.hyper.scrolltop;

          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.LinearLayout;
          import android.widget.Switch;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(60, 100, 60, 60);

                  TextView title = new TextView(this);
                  title.setText("澎湃OS 状态栏回顶设置");
                  title.setTextSize(22f);
                  title.setPadding(0, 0, 0, 40);

                  Switch sw = new Switch(this);
                  sw.setText("状态栏点击回顶");
                  sw.setTextSize(18f);
                  sw.setChecked(true);

                  layout.addView(title);
                  layout.addView(sw);
                  setContentView(layout);
              }
          }
          EOF

          gradle wrapper --gradle-version 8.2
          ./gradlew assembleDebug --warning-mode none

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperScrollToTop-debug.apk
          path: app/build/outputs/apk/debug/*.apk
