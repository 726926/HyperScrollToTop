name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK Cleanly
        run: |
          rm -rf settings.gradle build.gradle app/build.gradle app/src .gradle

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/hyper/scrolltop

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://api.xposed.info/' }
              }
          }
          rootProject.name = "HyperScrollToTop"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.hyper.scrolltop'
              compileSdk 34

              defaultConfig {
                  applicationId "com.hyper.scrolltop"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              compileOnly 'de.robv.android.xposed:api:82'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- 解除作用域死锁，允许用户自由勾选App -->
              <application
                  android:allowBackup="true"
                  android:label="状态栏回顶"
                  android:supportsRtl="true">
                  <meta-data android:name="xposedmodule" android:value="true" />
                  <meta-data android:name="xposeddescription" android:value="小米澎湃OS 3 状态栏点击回顶（必须在LSPosed中勾选SystemUI和需要生效的App）" />
                  <meta-data android:name="xposedminversion" android:value="93" />
                  <activity android:name="com.hyper.scrolltop.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/assets/xposed_init
          com.hyper.scrolltop.MainHook
          EOF

          cat << 'EOF' > app/src/main/java/com/hyper/scrolltop/MainHook.java
          package com.hyper.scrolltop;

          import android.app.Activity;
          import android.app.ActivityManager;
          import android.content.BroadcastReceiver;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.os.Build;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.AbsListView;
          import android.widget.ScrollView;

          import java.util.List;

          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedHelpers;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;

          public class MainHook implements IXposedHookLoadPackage {

              private static final String ACTION_SCROLL_TOP = "com.hyper.scrolltop.ACTION_SCROLL_TO_TOP";
              private float downY = 0;
              private float downX = 0;
              private long downTime = 0;

              @Override
              public void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpparam) {
                  // 1. 注入系统界面，监听点击
                  if ("com.android.systemui".equals(lpparam.packageName)) {
                      hookSystemUI(lpparam);
                  }
                  // 2. 注入目标应用，执行回顶
                  hookActivity(lpparam);
              }

              private void hookSystemUI(XC_LoadPackage.LoadPackageParam lpparam) {
                  String[] classes = {
                      "com.android.systemui.statusbar.phone.PhoneStatusBarView",
                      "com.android.systemui.statusbar.window.StatusBarWindowView",
                      "com.miui.systemui.statusbar.phone.MiuiPhoneStatusBarView",
                      "com.android.systemui.statusbar.phone.NotificationShadeWindowView"
                  };

                  for (String cls : classes) {
                      try {
                          XposedHelpers.findAndHookMethod(cls, lpparam.classLoader, "dispatchTouchEvent", MotionEvent.class, new XC_MethodHook() {
                              @Override
                              protected void beforeHookedMethod(MethodHookParam param) throws Throwable {
                                  MotionEvent event = (MotionEvent) param.args[0];
                                  if (event == null) return;
                                  int action = event.getActionMasked();
                                  
                                  if (action == MotionEvent.ACTION_DOWN) {
                                      downX = event.getRawX();
                                      downY = event.getRawY();
                                      downTime = System.currentTimeMillis();
                                  } else if (action == MotionEvent.ACTION_UP) {
                                      long timeDiff = System.currentTimeMillis() - downTime;
                                      float yDiff = Math.abs(event.getRawY() - downY);
                                      float xDiff = Math.abs(event.getRawX() - downX);
                                      
                                      // 严格判定：触控时间小于300ms，且手指滑动不超过50像素，判定为点击
                                      if (timeDiff < 300 && yDiff < 50 && xDiff < 50) {
                                          View view = (View) param.thisObject;
                                          sendExplicitBroadcast(view.getContext());
                                      }
                                  }
                              }
                          });
                      } catch (Throwable ignored) {}
                  }
              }

              private void sendExplicitBroadcast(Context context) {
                  try {
                      // 核心突破：自动获取当前屏幕上最顶层的App，并定向发送显式广播
                      ActivityManager am = (ActivityManager) context.getSystemService(Context.ACTIVITY_SERVICE);
                      List<ActivityManager.RunningTaskInfo> tasks = am.getRunningTasks(1);
                      if (tasks != null && !tasks.isEmpty()) {
                          ComponentName topActivity = tasks.get(0).topActivity;
                          if (topActivity != null) {
                              String packageName = topActivity.getPackageName();
                              Intent intent = new Intent(ACTION_SCROLL_TOP);
                              intent.setPackage(packageName); // 定向发往当前App
                              intent.addFlags(Intent.FLAG_RECEIVER_FOREGROUND);
                              context.sendBroadcast(intent);
                              return;
                          }
                      }
                  } catch (Throwable ignored) {}
                  
                  // 备用机制
                  Intent intent = new Intent(ACTION_SCROLL_TOP);
                  intent.addFlags(Intent.FLAG_RECEIVER_FOREGROUND);
                  context.sendBroadcast(intent);
              }

              private void hookActivity(XC_LoadPackage.LoadPackageParam lpparam) {
                  try {
                      XposedHelpers.findAndHookMethod("android.app.Activity", lpparam.classLoader, "onResume", new XC_MethodHook() {
                          @Override
                          protected void afterHookedMethod(MethodHookParam param) throws Throwable {
                              Activity activity = (Activity) param.thisObject;
                              if (activity == null || activity.getWindow() == null) return;
                              View decorView = activity.getWindow().getDecorView();
                              if (decorView == null) return;

                              int tagKey = 0x7f010099; 
                              if (Boolean.TRUE.equals(decorView.getTag(tagKey))) return;

                              BroadcastReceiver receiver = new BroadcastReceiver() {
                                  @Override
                                  public void onReceive(Context context, Intent intent) {
                                      if (intent != null && ACTION_SCROLL_TOP.equals(intent.getAction())) {
                                          scrollToTopRecursive(decorView);
                                      }
                                  }
                              };

                              IntentFilter filter = new IntentFilter(ACTION_SCROLL_TOP);
                              if (Build.VERSION.SDK_INT >= 33) {
                                  activity.registerReceiver(receiver, filter, Context.RECEIVER_EXPORTED);
                              } else {
                                  activity.registerReceiver(receiver, filter);
                              }
                              decorView.setTag(tagKey, true);
                          }
                      });
                  } catch (Throwable ignored) {}
              }

              private boolean scrollToTopRecursive(View view) {
                  if (view == null || !view.isShown()) return false;
                  boolean scrolled = false;

                  if (view instanceof ScrollView) {
                      ((ScrollView) view).smoothScrollTo(0, 0);
                      scrolled = true;
                  } else if (view instanceof AbsListView) {
                      ((AbsListView) view).smoothScrollToPosition(0);
                      scrolled = true;
                  } else {
                      String className = view.getClass().getName();
                      if (className.contains("RecyclerView")) {
                          try {
                              java.lang.reflect.Method method = view.getClass().getMethod("smoothScrollToPosition", int.class);
                              method.invoke(view, 0);
                              scrolled = true;
                          } catch (Throwable ignored) {}
                      } else if (className.contains("NestedScrollView")) {
                          try {
                              java.lang.reflect.Method method = view.getClass().getMethod("smoothScrollTo", int.class, int.class);
                              method.invoke(view, 0, 0);
                              scrolled = true;
                          } catch (Throwable ignored) {}
                      } else if (className.contains("WebView")) {
                          try {
                              java.lang.reflect.Method method = view.getClass().getMethod("scrollTo", int.class, int.class);
                              method.invoke(view, 0, 0);
                              scrolled = true;
                          } catch (Throwable ignored) {}
                      }
                  }

                  if (view instanceof ViewGroup) {
                      ViewGroup group = (ViewGroup) view;
                      for (int i = 0; i < group.getChildCount(); i++) {
                          if (scrollToTopRecursive(group.getChildAt(i))) {
                              scrolled = true;
                          }
                      }
                  }
                  return scrolled;
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/hyper/scrolltop/MainActivity.java
          package com.hyper.scrolltop;

          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.LinearLayout;
          import android.widget.Switch;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(60, 100, 60, 60);

                  TextView title = new TextView(this);
                  title.setText("澎湃OS 状态栏回顶设置");
                  title.setTextSize(22f);
                  title.setPadding(0, 0, 0, 40);

                  Switch sw = new Switch(this);
                  sw.setText("状态栏点击回顶"); // 已优化文案
                  sw.setTextSize(18f);
                  sw.setChecked(true);

                  layout.addView(title);
                  layout.addView(sw);
                  setContentView(layout);
              }
          }
          EOF

          gradle wrapper --gradle-version 8.2
          ./gradlew assembleDebug --warning-mode none

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperScrollToTop-debug.apk
          path: app/build/outputs/apk/debug/*.apk
